<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff; font-family:Roboto, Helvetica, Arial, sans-serif; color:#202124;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
        <td align="center" style="padding:24px 16px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;">
                <tr>
                    <td align="center" style="padding:16px 0 32px 0;">
                        <span style="font-size:32px; font-weight:800; letter-spacing:1px; color:#2E3EDF;">&#10148; VIDEOFLIX</span>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:16px; line-height:24px;">
                        <p style="margin:0 0 16px 0;">Dear <span style="color:#2E3EDF;">{{ user.email }}</span>,</p>
                        <p style="margin:0 0 24px 0;">
                            Thank you for registering with <span style="color:#2E3EDF;">Videoflix</span>.
                            To complete your registration and verify your email address, please click the link below:
                        </p>
                        <p style="margin:0 0 32px 0;">
                            <a href="{{ activation_link }}"
                               style="display:inline-block; background-color:#2E3EDF; color:#ffffff; text-decoration:none; font-weight:700; font-size:18px; padding:16px 32px; border-radius:40px;">
                                Activate account
                            </a>
                        </p>
                        <p style="margin:0 0 24px 0;">If you did not create an account with us, please disregard this email.</p>
                        <p style="margin:0 0 8px 0;">Best regards,</p>
                        <p style="margin:0;">Your Videoflix Team.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
